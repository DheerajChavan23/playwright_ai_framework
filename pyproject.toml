[project]
name = "ai-playwright-framework"
version = "0.1.0"
description = "Autonomous, self-healing E2E test automation framework powered by Google Gemini API and Playwright Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-google-genai",
    "google-genai",
    "playwright",
    "pytest",
    "pytest-playwright",
    "pytest-html",
    "allure-pytest",
    "pydantic-settings",
    "python-dotenv",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

